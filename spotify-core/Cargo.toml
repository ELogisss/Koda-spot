[workspace]
members = ["koda-spotify"]
resolver = "2"

# Cargo.lock pins vergen to 9.0.6 on purpose. vergen 9.1.0 (pulled in by
# librespot-core's build dependency on vergen-gitcl) depends on vergen-lib
# 9.1.0, while vergen-gitcl 1.0.8 still implements the 0.1.6 trait, so
# librespot-core's build script fails to compile. Re-pin with
# `cargo update -p vergen --precise 9.0.6` until librespot moves.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Android ships these bytes: whole-program optimisation and one codegen unit are
# worth the build time, and symbols are stripped because nothing reads them.
# Panics stay unwinding on purpose: the FFI layer catches them and turns them
# into errors instead of aborting the process.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
